services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esifit
      POSTGRES_PASSWORD: esifit
      POSTGRES_DB: esifit
    ports:
      - "5432:5432"
    volumes:
      - esifit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esifit"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://esifit:esifit@postgres:5432/esifit
      JWT_SECRET: ${JWT_SECRET:-dev-docker-secret-change-me}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ECONOMY: ${STRIPE_PRICE_ECONOMY:-}
      STRIPE_PRICE_VIP: ${STRIPE_PRICE_VIP:-}
      STRIPE_PRICE_ELITE: ${STRIPE_PRICE_ELITE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@esifit.local}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_KEY: ${SMS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  esifit_pg_data:
